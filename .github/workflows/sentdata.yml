name: 심리 지표 과거 자료 받기 (자동 1회)
on:
  push:
    paths: ['.github/workflows/sentdata.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 받기
        run: |
          mkdir out && cd out
          python3 - <<'PY'
          import urllib.request,json,time
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36','Accept':'*/*'}
          now=int(time.time())
          C={
           'aaii.xls':'https://www.aaii.com/files/surveys/sentiment.xls',
           'sffed_news.xlsx':'https://www.frbsf.org/wp-content/uploads/news_sentiment_data.xlsx',
           'umcsent.csv':'https://fred.stlouisfed.org/graph/fredgraph.csv?id=UMCSENT',
           'vix.json':f'https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?period1=0&period2={now}&interval=1d',
           'vxn.json':f'https://query1.finance.yahoo.com/v8/finance/chart/%5EVXN?period1=0&period2={now}&interval=1d',
           'spx.json':f'https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?period1=-1325635200&period2={now}&interval=1d',
           'cnnfg.json':'https://production.dataviz.cnn.io/index/fearandgreed/graphdata/2011-01-01',
           'putcall.csv':'https://cdn.cboe.com/resources/options/volume_and_call_put_ratios/totalpc.csv',
          }
          R={}
          for f,u in C.items():
            for k in range(3):
              try:
                b=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=60).read();open(f,'wb').write(b);R[f]={'ok':len(b)};break
              except Exception as e:
                R[f]={'err':str(e)[:150]};time.sleep(4)
          json.dump(R,open('status.json','w'),indent=1);print(R)
          PY
          git init -q -b sent && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm sent && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sent
