name: 뉴스 출처 시험 (자동 1회) 3
on:
  push:
    paths: ['.github/workflows/newsprobe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 시험
        run: |
          mkdir out && cd out
          python3 - <<'PY'
          import json,urllib.request,time,re
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36','Accept-Language':'ko-KR,ko;q=0.9,en;q=0.8'}
          C={
           'r_arctic1':'https://arctic-shift.photon-reddit.com/api/posts/search?subreddit=wallstreetbets&limit=100&sort=desc&after=2026-11-17',
           'r_arctic2':'https://arctic-shift.photon-reddit.com/api/posts/search?subreddit=stocks&limit=100',
           'r_pullpush':'https://api.pullpush.io/reddit/search/submission/?subreddit=stocks&size=50',
           'dc_stockus':'https://gall.dcinside.com/mgallery/board/lists/?id=stockus&page=1',
          }
          R={}
          for n,u in C.items():
            t0=time.time()
            try:
              H=dict(UA)
              if n.startswith('r_json'):H['User-Agent']='script:trillionare-sentiment:v1.0 (research)'
              r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25);b=r.read().decode('utf8','replace')
              titles=re.findall(r'<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>',b)[:6]
              dc=re.findall(r'class="gall_tit[^"]*"[^>]*>\s*<a[^>]*>(?:<em[^>]*></em>)?([^<]{2,80})',b)[:6]
              js=re.findall(r'"title": ?"([^"]{2,90})"',b)[:6]
              R[n]={'st':r.status,'len':len(b),'s':round(time.time()-t0,1),'n_item':b.count('<item')+b.count('<entry'),'titles':titles,'dc':dc,'json':js,'head':b[:200] if not (titles or dc or js) else '','snip':b[b.find('gall_tit ub-word'):b.find('gall_tit ub-word')+1400] if n.startswith('dc') else b[:600]}
            except Exception as e:
              R[n]={'err':str(e)[:160],'s':round(time.time()-t0,1)}
            time.sleep(4)
          json.dump(R,open('newsprobe.json','w'),ensure_ascii=False,indent=1)
          PY
          git init -q -b probe && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm newsprobe && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe
